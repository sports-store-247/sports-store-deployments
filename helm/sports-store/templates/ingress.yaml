{{- if .Values.services.gateway.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}-gateway
  namespace: {{ $.Release.Namespace }}
  annotations:
    {{- range $key, $value := .Values.services.gateway.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.services.gateway.ingress.className }}
  rules:
    {{- range .Values.services.gateway.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: gateway
                name: {{ $.Release.Name }}-gateway
                port:
                  number: {{ $.Values.services.gateway.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
