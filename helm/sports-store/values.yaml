namespace:
  create: true
  name: sports-store

global:
  imagePullPolicy: IfNotPresent

services:
  auth-service:
    enabled: true
    replicaCount: 1
    image:
      repository: sports-store-auth-service
      tag: dev
    containerPort: 8000
    service:
      type: ClusterIP
      port: 8000
    configMap: auth-config
    secretName: app-secrets
    env:
      config:
        ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      secrets:
        MONGO_URI: AUTH_MONGO_URI
        JWT_SECRET: JWT_SECRET
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  catalog-service:
    enabled: true
    replicaCount: 1
    image:
      repository: sports-store-catalog-service
      tag: dev
    containerPort: 8000
    service:
      type: ClusterIP
      port: 8000
    secretName: app-secrets
    env:
      secrets:
        MONGO_URI: CATALOG_MONGO_URI
        JWT_SECRET: JWT_SECRET
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  cart-service:
    enabled: true
    replicaCount: 1
    image:
      repository: sports-store-cart-service
      tag: dev
    containerPort: 8000
    service:
      type: ClusterIP
      port: 8000
    configMap: cart-config
    secretName: app-secrets
    env:
      config:
        CATALOG_URL: "http://catalog-service:8000"
      secrets:
        MONGO_URI: CART_MONGO_URI
        JWT_SECRET: JWT_SECRET
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  order-service:
    enabled: true
    replicaCount: 1
    image:
      repository: sports-store-order-service
      tag: dev
    containerPort: 8000
    service:
      type: ClusterIP
      port: 8000
    configMap: order-config
    secretName: app-secrets
    env:
      config:
        CART_URL: "http://cart-service:8000"
        CATALOG_URL: "http://catalog-service:8000"
        PAYMENT_URL: "http://payment-service:8000"
        SHIPPING_FLAT_RATE: "25"
        FREE_SHIPPING_THRESHOLD: "300"
      secrets:
        MONGO_URI: ORDER_MONGO_URI
        JWT_SECRET: JWT_SECRET
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  payment-service:
    enabled: true
    replicaCount: 1
    image:
      repository: sports-store-payment-service
      tag: dev
    containerPort: 8000
    service:
      type: ClusterIP
      port: 8000
    configMap: payment-config
    secretName: app-secrets
    env:
      config:
        PAYMENT_FAILURE_SUFFIX: "fail"
      secrets:
        MONGO_URI: PAYMENT_MONGO_URI
        JWT_SECRET: JWT_SECRET
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  gateway:
    enabled: true
    replicaCount: 1
    image:
      repository: sports-store-gateway
      tag: dev
    containerPort: 80
    service:
      type: LoadBalancer
      port: 80
    env: {}
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

secrets:
  app:
    name: app-secrets
    data:
      JWT_SECRET: sports-store-local-jwt-secret
      MONGO_ROOT_USERNAME: root
      MONGO_ROOT_PASSWORD: sports-store-local-password
      AUTH_MONGO_URI: mongodb://root:sports-store-local-password@mongodb:27017/auth_db?authSource=admin
      CATALOG_MONGO_URI: mongodb://root:sports-store-local-password@mongodb:27017/catalog_db?authSource=admin
      CART_MONGO_URI: mongodb://root:sports-store-local-password@mongodb:27017/cart_db?authSource=admin
      ORDER_MONGO_URI: mongodb://root:sports-store-local-password@mongodb:27017/order_db?authSource=admin
      PAYMENT_MONGO_URI: mongodb://root:sports-store-local-password@mongodb:27017/payment_db?authSource=admin


mongodb:
  enabled: true
  auth:
    enabled: true
    rootUser: root
    rootPassword: sports-store-local-password
  architecture: standalone
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
